<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout | Classic Vapes</title>

  <!-- fonts & styles -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>

<body>

<header class="top-header">
  <div class="header-left">
    <a href="index.html"><img src="images/logo.png" class="logo" alt="Logo"></a>
  </div>
  <div class="header-right">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </div>
</header>

<div class="checkout-container">

  <!-- ORDER SUMMARY -->
  <div class="order-summary">
    <h2>Order Summary</h2>
    <div id="order-items"></div>
    <h3>Total: ₹<span id="order-total">0</span></h3>
  </div>

  <!-- UPI PAYMENT -->
  <div class="upi-box">
    <h3>Scan to Pay</h3>
    <img src="images/qr.png" alt="UPI QR Code">
    <p>UPI ID: <strong>classicvapes@upi</strong></p>
  </div>

  <!-- CHECKOUT FORM -->
  <div class="checkout-form">
    <input type="text" id="cus-name" placeholder="Full Name" required>
    <input type="number" id="cus-phone" placeholder="Mobile Number" required>
    <textarea id="cus-address" rows="3" placeholder="Delivery Address" required></textarea>
    <input type="text" id="payment-id" placeholder="Payment Transaction ID / UTR" required>

    <button class="btn-primary" id="place-order-btn">Place Order</button>
  </div>

</div>

<!-- FOOTER -->
<footer class="checkout-footer">
  <p>Contact: classicvapes@gmail.com | Instagram: @classicvapes</p>
</footer>

<script src="js/cart.js"></script>

<script>
// Load cart & display order
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
const orderItems = document.getElementById("order-items");
const orderTotal = document.getElementById("order-total");

function loadOrderSummary() {
  let total = 0;
  orderItems.innerHTML = "";

  if(cart.length === 0){
    orderItems.innerHTML = "<p>Your cart is empty</p>";
    orderTotal.innerText = "0";
    return;
  }

  cart.forEach(p => {
    total += p.price * p.qty;

    orderItems.innerHTML += `
      <div class="order-item">
        <div style="display:flex;align-items:center">
          <img src="${p.image || 'images/logo.png'}" onerror="this.src='images/logo.png'">
          <span>${p.name} × ${p.qty}</span>
        </div>
        <span>₹${p.price * p.qty}</span>
      </div>
    `;
  });

  orderTotal.innerText = total;
}

loadOrderSummary();


// Place Order Button
document.getElementById("place-order-btn").addEventListener("click", () => {

  const name = document.getElementById("cus-name").value.trim();
  const phone = document.getElementById("cus-phone").value.trim();
  const address = document.getElementById("cus-address").value.trim();
  const payid = document.getElementById("payment-id").value.trim();

  if(!name || !phone || !address || !payid){
    alert("⚠ Please fill all details");
    return;
  }

  let msg = `🛒 *New Order*%0A%0A👤 Name: ${name}%0A📞 Phone: ${phone}%0A📍 Address: ${address}%0A💳 Payment ID: ${payid}%0A%0A🧾 *Items:*%0A`;

  cart.forEach(p => {
    msg += `▫ ${p.name} × ${p.qty} = ₹${p.price * p.qty}%0A`;
  });

  msg += `%0A💰 Total: ₹${orderTotal.innerText}`;

  const whatsappURL = `https://wa.me/919999999999?text=${msg}`;
  window.open(whatsappURL, "_blank");

  localStorage.removeItem("cart");
  alert("✅ Order placed! Redirecting to WhatsApp...");
  window.location.href = "index.html";
});

</script>

</body>
</html>
