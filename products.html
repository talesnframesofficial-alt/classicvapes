<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassicVapes Products</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Preloader -->
  <div id="preloader">
    <img src="images/logo.png" alt="Logo">
  </div>

  <!-- Header -->
  <header>
    <a href="index.html"><img src="images/logo.png" class="logo" alt="Logo"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
      <button class="view-cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
    </nav>
  </header>

  <!-- Search Bar -->
  <section class="search-section">
    <input type="text" id="search-input" placeholder="Search products...">
  </section>

  <!-- Products Container -->
  <section class="products-container" id="products-container"></section>

  <!-- Cart Popup -->
  <div class="cart" id="cart">
    <h3>Your Cart</h3>
    <div id="cart-items"></div>
    <p class="cart-total">Total: ₹<span id="total">0</span></p>
    <button class="checkout-btn" onclick="window.location.href='checkout.html'">Checkout</button>
  </div>

  <footer>
    Contact us: classicvapes@gmail.com | Instagram: @classicvapes
  </footer>

  <script src="js/products.js"></script>
</body>
</html>
