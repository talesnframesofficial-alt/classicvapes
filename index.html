<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClassicVapes</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top-header">
  <div class="header-left">
    <a href="index.html"><img src="images/logo.png" class="logo" alt="ClassicVapes" onerror="this.onerror=null;this.src='images/logo.png'"></a>
  </div>

  <div class="header-right">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
    </nav>

    <button class="cart-btn" onclick="toggleCart()" aria-label="Open cart">
      <svg viewBox="0 0 24 24" class="cart-icon" width="22" height="22"><path d="M7 4h-2l-3 9v2h2l1 5h14l1-5h2v-2l-3-9h-2m-2 0h-6m-1 0l-1 3h10l-1-3m-7 7h10l1 4h-12l1-4zm2 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="currentColor"/></svg>
      <span id="cart-count">0</span>
    </button>

    <button class="hamburger" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')">☰</button>
  </div>
</header>

<!-- HERO -->
<section class="hero-slider" id="hero-slider" aria-label="Promotions">
  <div class="hero-slide"><img src="https://i.ibb.co/VWNgVPKc/hero1.webp" alt="Hero 1" loading="lazy"></div>
  <div class="hero-slide"><img src="https://i.ibb.co/zML9WG1/hero2.jpg" alt="Hero 2" loading="lazy"></div>
  <div class="hero-slide"><img src="https://i.ibb.co/XZJ23Qt6/hero4.webp" alt="Hero 3" loading="lazy"></div>

  <div class="hero-overlay">
    <h1 class="hero-title">Style. Scent. Spark.</h1>
    <p class="hero-sub">Discover premium Eld Bars & Vape Products designed with elegance.</p>
    <button class="shop-btn" onclick="location.href='products.html'">Shop Now</button>
  </div>

  <div id="hero-dots" class="hero-dots" aria-hidden="false"></div>
</section>

<!-- FEATURED -->
<section>
  <h2 class="section-title">Featured Products</h2>
  <div id="featured-carousel-wrap">
    <div id="featured-carousel"></div>
  </div>
</section>

<!-- CART -->
<div class="cart" id="cart" aria-hidden="true">
  <h3>Your Cart</h3>
  <div id="cart-items"></div>
  <p class="cart-total">Total: ₹<span id="total">0</span></p>
  <button class="checkout-btn" onclick="location.href='checkout.html'">Checkout</button>
</div>

<!-- POPUP placeholder will be injected by JS -->

<footer class="site-footer">
  <div>📩 Contact us: <a href="mailto:classicvapes@gmail.com">classicvapes@gmail.com</a></div>
  <div>📸 Instagram: <a href="https://instagram.com/classicvapes" target="_blank">@classicvapes</a></div>
</footer>


<script src="js/cart.js" defer></script>
<script src="js/home.js" defer></script>
</body>
</html>
