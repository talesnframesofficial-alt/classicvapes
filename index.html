<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClassicVapes</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <a href="index.html">
    <img src="images/logo.png" class="logo" onerror="this.src='https://i.ibb.co/placeholder/logo.png';" alt="ClassicVapes">
  </a>

  <div class="header-right">
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
    </nav>

    <button class="cart-btn" onclick="toggleCart()">
      🛒 <span id="cart-count">0</span>
    </button>
  </div>
</header>

<!-- HERO SLIDER -->
<section class="hero-slider" id="hero-slider">
  <div class="slide"><img src="https://i.ibb.co/VWNgVPKc/hero1.webp" onerror="this.src='https://i.ibb.co/placeholder/hero.webp'"></div>
  <div class="slide"><img src="https://i.ibb.co/zML9WG1/hero2.jpg" onerror="this.src='https://i.ibb.co/placeholder/hero.webp'"></div>
  <div class="slide"><img src="https://i.ibb.co/XZJ23Qt6/hero4.webp" onerror="this.src='https://i.ibb.co/placeholder/hero.webp'"></div>

  <button class="shop-btn" onclick="location.href='products.html'">Shop Now</button>
  <div id="hero-dots"></div>
</section>

<!-- FEATURED PRODUCTS -->
<section>
  <h2 class="section-title">Featured Products</h2>
  <div id="featured-carousel"></div>
</section>

<!-- CART POPUP -->
<div class="cart" id="cart">
  <h3>Your Cart</h3>
  <div id="cart-items"></div>
  <p class="cart-total">Total: ₹<span id="total">0</span></p>
  <button class="checkout-btn" onclick="location.href='checkout.html'">Checkout</button>
</div>

<footer>Contact us: classicvapes@gmail.com | Instagram: @classicvapes</footer>

<script src="js/cart.js"></script>

<script>
/* ==== HERO SLIDER ==== */
let slides = document.querySelectorAll(".slide");
let dotsBox = document.querySelector("#hero-dots");
let index = 0;

slides.forEach((_, i) => {
  let d = document.createElement("div");
  d.classList.add("hero-dot");
  if(i === 0) d.classList.add("active");
  d.onclick = () => goSlide(i);
  dotsBox.appendChild(d);
});

function goSlide(i){
  slides.forEach(s => s.style.display="none");
  document.querySelectorAll(".hero-dot").forEach(d => d.classList.remove("active"));
  slides[i].style.display="block";
  document.querySelectorAll(".hero-dot")[i].classList.add("active");
  index = i;
}

function autoSlide(){
  index = (index + 1) % slides.length;
  goSlide(index);
}
goSlide(0);
setInterval(autoSlide, 3000);

/* ==== FETCH PRODUCTS ==== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT15M2LZhCAW1EXXp1oRB9oFn5Enj2DvuReH7tlPPlq3rkSffsRy12r09TsmCLgapn4jG01U9bcv6-2/pub?output=csv";

async function loadFeatured() {
  const res = await fetch(CSV_URL);
  const data = await res.text();
  const rows = data.split("\n").slice(1);

  const container = document.getElementById("featured-carousel");

  rows.slice(0,10).forEach(row => {
    const col = row.split(",");
    const [id,name,price,img] = col;

    container.innerHTML += `
    <div class="product-card">
      <img src="${img}" onerror="this.src='https://i.ibb.co/placeholder/product.png'">
      <h3>${name}</h3>
      <div class="price-row"><span class="offer">₹${price}</span></div>
      <div class="card-actions">
        <button class="view-btn">View</button>
        <button class="buy-btn" onclick="addToCart({id:'${id}',name:'${name}',price:${price}})">Add</button>
      </div>
    </div>`;
  });
}

loadFeatured();
</script>

</body>
</html>
